name: Weekly Regulation Update

on:
  schedule:
    - cron: '7 9 * * 1'   # Every Monday 09:07 UTC
  workflow_dispatch:        # Also runnable manually from the Actions tab


jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Snapshot current law IDs so we can identify what was added this run
      - name: Snapshot existing law IDs
        run: |
          jq '[.[].id]' data/regulations.json > /tmp/original-ids.json
          echo "Snapshotted $(jq length /tmp/original-ids.json) existing law IDs"

      # ── Step 1: New enacted regulations ──────────────────────────────────────
      - name: Research and add new regulations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          cat << PROMPT | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,Read,Write"
          You are the weekly curator for GAIA — Global AI Atlas.
          The database is at data/regulations.json in the current directory.
          Today is $TODAY. Search the web for AI regulations enacted in the past 7 days.

          Run the following searches and synthesise results before writing anything.

          ENGLISH-LANGUAGE SEARCHES:
          - New AI laws signed into law by national governments
          - New US state AI bills enacted (signed by governor)
          - New executive orders on AI
          - New agency rules from FTC, NIST, FDA, SEC, CFPB, EEOC
          - New EU regulations or implementing acts (search EUR-Lex for "artificial intelligence" published in past 7 days)
          - New frameworks from OECD, UN, UNESCO, G7, African Union, ASEAN

          NON-ENGLISH JURISDICTIONS — search these directly even if not in English news:
          - Japan: search "AI 規制 法律" and check METI (meti.go.jp) and FSA (fsa.go.jp) for new AI guidelines or rules
          - South Korea: search "인공지능 규제 법률" and check MSIT (msit.go.kr)
          - China: check CAC (cyberspace.gov.cn) and MIIT (miit.gov.cn) for new AI regulations published this week
          - Brazil: search "inteligência artificial lei" and check ANPD (gov.br/anpd) and Senado Federal
          - France/Germany/Italy: check national gazette sites for AI-specific implementing measures under EU AI Act
          - India: check MeitY (meity.gov.in) for new AI policy instruments

          IMPLEMENTING ACTS — check for secondary legislation under existing frameworks:
          - EU AI Act delegated/implementing regulations published in the Official Journal this week
          - US federal agency guidance documents or final rules that implement AI-specific requirements
          - Any state-level implementing regulations under recently enacted AI statutes

          Only add instruments that are genuinely newly enacted — not proposed or in committee.

          For each new instrument, append a record to data/regulations.json with these fields:
          {
            "id": "{iso}-{jurisdiction_slug}-{law_slug}-{year}",
            "short_name": "...",
            "full_name": "...",
            "country": "Country name or Global / Regional",
            "jurisdiction": "Country, state, agency, or body name",
            "jurisdiction_type": "supranational|national|subnational|agency",
            "region": "e.g. North America",
            "status": "in_force|enacted_not_yet_effective",
            "enacted_date": "YYYY-MM-DD",
            "effective_date": null,
            "operative_dates": null,
            "last_verified": "$TODAY",
            "source_url": "official URL",
            "primary_category": "one of: data_protection|algorithmic_systems|synthetic_media|biometric_identity|ip_creative_rights|national_security|sector_healthcare|sector_employment|sector_financial|sector_education|general_ai_governance",
            "categories": ["..."],
            "legal_family": "eu_risk_based|us_consumer_protection|china_state_sovereignty|uk_non_model|hybrid|standalone",
            "instrument_binding": true,
            "ai_specific": true,
            "summary": "2-3 sentence plain English summary.",
            "provisions": {
              "private_right_of_action": false,
              "max_penalty_usd_approx": null,
              "enforcement_body": null,
              "extraterritorial": false
            },
            "inspired_by": [],
            "influenced": []
          }

          jurisdiction_type rules:
          - UN/EU/OECD/ASEAN/G7/African Union: supranational (country = Global / Regional)
          - National law: national (jurisdiction = country)
          - US state / Canadian province: subnational
          - FTC/NIST/FDA/SEC/CFPB/EEOC: agency

          Do NOT add duplicates. Check existing IDs and short_names first.
          Be conservative — one verified entry beats five uncertain ones.
          If nothing new was found, do not modify data/regulations.json.
          PROMPT

      # ── Step 1b: Discover international proposed bills ───────────────────────
      - name: Discover international proposed bills
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          cat << PROMPT | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Read,Write"
          You are discovering newly introduced AI legislation globally for GAIA.
          Today is $TODAY. The database is at data/regulations.json.

          Search each parliament below for AI-related bills introduced or significantly
          advanced in the past 7 days. For each parliament, run at least one targeted search.

          SUPRANATIONAL:
          - EU: search EUR-Lex for new Commission proposals or Parliament reports on AI
            (eur-lex.europa.eu, search type:proposal subject:artificial-intelligence)
          - Council of Europe: check recent AI-related instruments or recommendations
          - OECD/UN: any new AI governance instruments or frameworks

          EUROPE:
          - UK: search bills.parliament.uk "artificial intelligence" — new bills this week
          - Germany: search bundestag.de for AI-related Gesetzentwürfe (draft laws)
          - France: search assemblee-nationale.fr for IA or intelligence artificielle bills
          - Netherlands: search tweedekamer.nl for AI-related wetsvoorstellen

          NORTH AMERICA:
          - Canada: search LEGISinfo (parl.ca/legisinfo) for "artificial intelligence" bills
            in the House of Commons or Senate introduced this week

          ASIA-PACIFIC:
          - Japan: search "人工知能 法案" (AI bill) at kokkai.ndl.go.jp or news sources
          - South Korea: search "인공지능 법안" at assembly.go.kr
          - Australia: search aph.gov.au/Bills_Legislation for AI-related bills
          - Singapore: search parliament.gov.sg for AI-related bills or motions
          - India: check loksabha.nic.in for AI-related Private Member Bills or Government Bills

          LATIN AMERICA:
          - Brazil: search camara.leg.br "inteligência artificial" for new PL (project of law)
          - Mexico: search congreso.gob.mx for IA legislation

          AFRICA & MIDDLE EAST:
          - South Africa: check parliament.gov.za for AI-related bills
          - UAE/Saudi Arabia: search for new AI regulatory instruments
          - Kenya/Rwanda/Ghana: check recent AI governance instruments

          For each newly introduced bill found that is NOT already in data/regulations.json,
          add a record with status=proposed:
          {
            "id": "{iso2}-{jx_slug}-{bill_slug}-{year}",
            "short_name": "Short descriptive name",
            "full_name": "Official bill title",
            "country": "Country name",
            "jurisdiction": "Parliament or legislature name",
            "jurisdiction_type": "national|supranational|subnational",
            "region": "e.g. Europe & Central Asia",
            "status": "proposed",
            "bill_number": "Official bill/dossier number",
            "legislative_stage": "introduced|in_committee|passed_committee|passed_one_chamber|passed_legislature|awaiting_signature|unknown",
            "last_action_date": "$TODAY",
            "last_action_description": "One sentence describing current status",
            "last_verified": "$TODAY",
            "source_url": "Official parliament URL for this bill",
            "official_text_url": "Direct URL to bill text if available, else null",
            "primary_category": "one of the standard categories",
            "categories": ["..."],
            "legal_family": "appropriate value",
            "instrument_binding": true,
            "ai_specific": true,
            "summary": "2-3 sentence plain English summary of what the bill would do.",
            "inspired_by": [],
            "influenced": []
          }

          Stage mapping guide:
            introduced        = filed/introduced, no committee action yet
            in_committee      = referred to and under consideration by committee
            passed_committee  = committee approved/reported the bill
            passed_one_chamber = passed one house (House of Commons, Bundestag, etc.)
            passed_legislature = passed all required chambers
            awaiting_signature = awaiting presidential/royal assent or promulgation

          Check existing records first — do not add duplicates (check bill_number and short_name).
          Be conservative: only add bills clearly focused on AI with an official source URL.
          If nothing new found, do not modify data/regulations.json.
          PROMPT

      # ── Step 1c: Fetch full text for newly added laws ─────────────────────────
      - name: Fetch full text for new laws
        run: npm run fetch-texts:skip
        continue-on-error: true   # blocked sites shouldn't stop the rest of the run

      # ── Step 2: Effective date promotions (no LLM needed) ────────────────────
      - name: Promote enacted laws whose effective date has passed
        run: |
          TODAY=$(date +%Y-%m-%d)
          jq --arg today "$TODAY" '
            map(
              if .status == "enacted_not_yet_effective"
                 and .effective_date != null
                 and .effective_date <= $today
              then . + {status: "in_force", last_verified: $today}
              else .
              end
            )
          ' data/regulations.json > /tmp/regulations-promoted.json
          BEFORE=$(jq length data/regulations.json)
          PROMOTED=$(jq --arg today "$TODAY" '[.[] | select(.status == "in_force" and .last_verified == $today)] | length' /tmp/regulations-promoted.json)
          mv /tmp/regulations-promoted.json data/regulations.json
          echo "Promoted $PROMOTED law(s) to in_force"

      # ── Step 3a: LegiScan — US state bills (authoritative API) ────────────────
      - name: Bill stages — US states (LegiScan API)
        continue-on-error: true
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: |
          if [ -z "$LEGISCAN_API_KEY" ]; then
            echo "LEGISCAN_API_KEY not set — skipping LegiScan, all US bills go to fallback"
            echo "[]" > /tmp/legiscan-unmatched.json
          else
            npx tsx scripts/update-bill-stages-legiscan.ts
          fi

      # ── Step 3b: Five parallel regional agents ────────────────────────────────
      - name: Bill stages — regional agents (parallel)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          # Initialise output files so merge step always finds valid JSON
          for region in europe apac americas africa-me us-fallback; do
            printf '{}' > /tmp/updates-${region}.json
          done

          PIDS=()

          # ── Europe agent ──────────────────────────────────────────────────────
          (cat << EUROPE_DONE | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Read,Write"
          You are the Europe bill-stage agent for GAIA — Global AI Atlas.
          Today is $TODAY. You run in parallel with other regional agents — do NOT modify data/regulations.json.

          YOUR JURISDICTIONS: UK, European Union (EP/Commission/Council), Germany, France, Netherlands, Italy, Spain, Sweden, Denmark, Norway, Finland, Switzerland, Belgium, Austria, Poland, Czech Republic, Hungary, Romania, Greece, Portugal, Ireland, Council of Europe, Iceland, Liechtenstein, Estonia, Latvia, Lithuania, Slovenia, Slovakia, Croatia, Bulgaria, Serbia, North Macedonia, Albania, Moldova, Ukraine, Georgia, Armenia, Azerbaijan, Kazakhstan, Uzbekistan, Kyrgyzstan, Tajikistan, Turkmenistan

          TASK 1 — Load your bills.
          Read data/regulations.json. Collect all records where:
            - status = "proposed"
            - country or jurisdiction is in your jurisdiction list

          TASK 2 — Verify high-momentum bills first.
          For each bill at stage awaiting_signature, passed_legislature, passed_one_chamber, or passed_committee:
            - Use WebFetch to check the bill's source_url directly
            - Search: "[jurisdiction] [bill_number or short_name] [year]"

          TASK 3 — Broad enacted/failed search (past 7 days).
          Run these searches:
            "UK artificial intelligence bill 2026"
            "EU AI Act implementing regulation 2026 official journal"
            "European Parliament AI vote 2026"
            "Bundestag KI Gesetz 2026"
            "France assemblée nationale intelligence artificielle 2026"
            "Russia artificial intelligence law 2026"
            "Россия искусственный интеллект закон 2026"

          Key sources: bills.parliament.uk, eur-lex.europa.eu, europarl.europa.eu, bundestag.de, assemblee-nationale.fr, tweedekamer.nl, camera.it

          TASK 4 — Update lower-momentum bills.
          For in_committee or introduced bills: run targeted searches to check if they have advanced.
          Focus on bills with no last_action_date or last_action_date older than 30 days.

          TASK 5 — Write your results.
          Write a single JSON object to /tmp/updates-europe.json:
          {
            "bill-id": {
              "legislative_stage": "introduced|in_committee|passed_committee|passed_one_chamber|passed_legislature|awaiting_signature",
              "last_action_date": "YYYY-MM-DD",
              "last_action_description": "One plain-English sentence describing the action",
              "last_verified": "$TODAY"
            }
          }
          For terminal outcomes: set "status": "failed"|"vetoed"|"in_force" and omit legislative_stage.
          For enacted bills: also set "enacted_date": "YYYY-MM-DD".
          If no verified updates found: write exactly {}
          Do NOT include records you could not verify from an official source.
          EUROPE_DONE
          ) > /tmp/log-europe.txt 2>&1 &
          PIDS+=($!)

          # ── APAC agent ────────────────────────────────────────────────────────
          (cat << APAC_DONE | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Read,Write"
          You are the Asia-Pacific bill-stage agent for GAIA — Global AI Atlas.
          Today is $TODAY. You run in parallel with other regional agents — do NOT modify data/regulations.json.

          YOUR JURISDICTIONS: Japan, South Korea, Australia, India, China, Singapore, New Zealand, Indonesia, Malaysia, Philippines, Taiwan, Vietnam, Thailand, Bangladesh, Pakistan, Sri Lanka, Myanmar, Cambodia, Laos, Mongolia, Nepal, Bhutan, Maldives, Papua New Guinea, Fiji, Vanuatu, Tonga, Samoa

          TASK 1 — Load your bills.
          Read data/regulations.json. Collect all records where:
            - status = "proposed"
            - country or jurisdiction is in your jurisdiction list

          TASK 2 — Verify high-momentum bills first.
          For each bill at stage awaiting_signature, passed_legislature, passed_one_chamber, or passed_committee:
            - Use WebFetch to check the bill's source_url directly
            - Search: "[jurisdiction] [bill_number or short_name] [year]"

          TASK 3 — Broad enacted/failed search (past 7 days).
          Run these searches:
            "Japan AI law 2026"
            "人工知能 法律 成立 2026"
            "인공지능 법 통과 2026"
            "Australia AI bill passed 2026"
            "India AI regulation bill Lok Sabha 2026"
            "China AI regulation 2026"
            "中国 人工智能 法规 2026"
            "Singapore AI bill 2026"

          Key sources: aph.gov.au, assembly.go.kr, kokkai.ndl.go.jp, loksabha.nic.in, parliament.gov.sg, npc.gov.cn

          TASK 4 — Update lower-momentum bills.
          For in_committee or introduced bills: run targeted searches to check if they have advanced.
          Focus on bills with no last_action_date or last_action_date older than 30 days.

          TASK 5 — Write your results.
          Write a single JSON object to /tmp/updates-apac.json:
          {
            "bill-id": {
              "legislative_stage": "introduced|in_committee|passed_committee|passed_one_chamber|passed_legislature|awaiting_signature",
              "last_action_date": "YYYY-MM-DD",
              "last_action_description": "One plain-English sentence describing the action",
              "last_verified": "$TODAY"
            }
          }
          For terminal outcomes: set "status": "failed"|"vetoed"|"in_force" and omit legislative_stage.
          For enacted bills: also set "enacted_date": "YYYY-MM-DD".
          If no verified updates found: write exactly {}
          Do NOT include records you could not verify from an official source.
          APAC_DONE
          ) > /tmp/log-apac.txt 2>&1 &
          PIDS+=($!)

          # ── Americas agent ────────────────────────────────────────────────────
          (cat << AMERICAS_DONE | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Read,Write"
          You are the Americas bill-stage agent for GAIA — Global AI Atlas.
          Today is $TODAY. You run in parallel with other regional agents — do NOT modify data/regulations.json.

          YOUR JURISDICTIONS: Canada, Brazil, Mexico, Argentina, Chile, Colombia, Peru, Uruguay, Ecuador, Bolivia, Costa Rica, Panama, Guatemala, Honduras, El Salvador, Nicaragua, Dominican Republic, Haiti, Jamaica, Trinidad and Tobago, Barbados, Guyana, Suriname, Venezuela, Paraguay, Cuba

          TASK 1 — Load your bills.
          Read data/regulations.json. Collect all records where:
            - status = "proposed"
            - country or jurisdiction is in your jurisdiction list

          TASK 2 — Verify high-momentum bills first.
          For each bill at stage awaiting_signature, passed_legislature, passed_one_chamber, or passed_committee:
            - Use WebFetch to check the bill's source_url directly
            - Search: "[jurisdiction] [bill_number or short_name] [year]"

          TASK 3 — Broad enacted/failed search (past 7 days).
          Run these searches:
            "Canada artificial intelligence act passed 2026"
            "Brazil inteligência artificial lei sancionada 2026"
            "Mexico inteligencia artificial ley 2026"
            "Colombia inteligencia artificial proyecto de ley 2026"
            "Chile inteligencia artificial ley 2026"
            "Argentina inteligencia artificial proyecto de ley 2026"

          Key sources: parl.ca/legisinfo, camara.leg.br, senado.leg.br, congreso.gob.mx, congreso.gob.co

          TASK 4 — Update lower-momentum bills.
          For in_committee or introduced bills: run targeted searches to check if they have advanced.
          Focus on bills with no last_action_date or last_action_date older than 30 days.

          TASK 5 — Write your results.
          Write a single JSON object to /tmp/updates-americas.json:
          {
            "bill-id": {
              "legislative_stage": "introduced|in_committee|passed_committee|passed_one_chamber|passed_legislature|awaiting_signature",
              "last_action_date": "YYYY-MM-DD",
              "last_action_description": "One plain-English sentence describing the action",
              "last_verified": "$TODAY"
            }
          }
          For terminal outcomes: set "status": "failed"|"vetoed"|"in_force" and omit legislative_stage.
          For enacted bills: also set "enacted_date": "YYYY-MM-DD".
          If no verified updates found: write exactly {}
          Do NOT include records you could not verify from an official source.
          AMERICAS_DONE
          ) > /tmp/log-americas.txt 2>&1 &
          PIDS+=($!)

          # ── Africa & Middle East agent ─────────────────────────────────────────
          (cat << AFRICAME_DONE | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Read,Write"
          You are the Africa & Middle East bill-stage agent for GAIA — Global AI Atlas.
          Today is $TODAY. You run in parallel with other regional agents — do NOT modify data/regulations.json.

          YOUR JURISDICTIONS: South Africa, Nigeria, Kenya, Ghana, Rwanda, Ethiopia, Tanzania, Uganda, Senegal, Egypt, Morocco, Tunisia, Algeria, Libya, Sudan, Côte d'Ivoire, Cameroon, Mozambique, Zimbabwe, Zambia, Botswana, Namibia, Malawi, UAE, Saudi Arabia, Israel, Qatar, Kuwait, Bahrain, Oman, Jordan, Lebanon, Iraq, Iran, Syria, Yemen, Turkey

          TASK 1 — Load your bills.
          Read data/regulations.json. Collect all records where:
            - status = "proposed"
            - country or jurisdiction is in your jurisdiction list

          TASK 2 — Verify high-momentum bills first.
          For each bill at stage awaiting_signature, passed_legislature, passed_one_chamber, or passed_committee:
            - Use WebFetch to check the bill's source_url directly
            - Search: "[jurisdiction] [bill_number or short_name] [year]"

          TASK 3 — Broad enacted/failed search (past 7 days).
          Run these searches:
            "South Africa AI bill 2026"
            "Nigeria artificial intelligence bill 2026"
            "Kenya data protection AI 2026"
            "UAE artificial intelligence regulation 2026"
            "Saudi Arabia AI regulation 2026"
            "Israel artificial intelligence bill 2026"
            "Turkey yapay zeka kanun 2026"
            "Bahrain AI regulation 2026"

          Key sources: parliament.gov.za, nass.gov.ng, parliament.go.ke, uaecabinet.ae, knesset.gov.il

          TASK 4 — Update lower-momentum bills.
          For in_committee or introduced bills: run targeted searches to check if they have advanced.
          Focus on bills with no last_action_date or last_action_date older than 30 days.

          TASK 5 — Write your results.
          Write a single JSON object to /tmp/updates-africa-me.json:
          {
            "bill-id": {
              "legislative_stage": "introduced|in_committee|passed_committee|passed_one_chamber|passed_legislature|awaiting_signature",
              "last_action_date": "YYYY-MM-DD",
              "last_action_description": "One plain-English sentence describing the action",
              "last_verified": "$TODAY"
            }
          }
          For terminal outcomes: set "status": "failed"|"vetoed"|"in_force" and omit legislative_stage.
          For enacted bills: also set "enacted_date": "YYYY-MM-DD".
          If no verified updates found: write exactly {}
          Do NOT include records you could not verify from an official source.
          AFRICAME_DONE
          ) > /tmp/log-africa-me.txt 2>&1 &
          PIDS+=($!)

          # ── US fallback agent ─────────────────────────────────────────────────
          (cat << USFALLBACK_DONE | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Read,Write"
          You are the US fallback bill-stage agent for GAIA — Global AI Atlas.
          Today is $TODAY. You run in parallel with other regional agents — do NOT modify data/regulations.json.

          YOUR SCOPE: Unmatched US state bills (not found by LegiScan) + US federal/Congress bills.

          TASK 1 — Load unmatched US state bills.
          Read /tmp/legiscan-unmatched.json (list of bill IDs LegiScan could not match).
          If the file is missing or empty ([] or {}), skip US state fallback entirely.
          For each unmatched bill ID: look it up in data/regulations.json to get short_name, bill_number, and region (state abbreviation).
          Search: "[Full State Name] [bill_number] AI 2026"

          TASK 2 — Check US Congress (federal level).
          Read data/regulations.json. Collect all proposed bills where jurisdiction matches "US Congress" or "United States Congress".
          Search congress.gov for their current status.
          Broad searches:
            "US Senate AI bill 2026"
            "US Congress artificial intelligence act 2026"

          Key sources: state legislature .gov sites, congress.gov, govtrack.us

          TASK 3 — Write your results.
          Write a single JSON object to /tmp/updates-us-fallback.json:
          {
            "bill-id": {
              "legislative_stage": "introduced|in_committee|passed_committee|passed_one_chamber|passed_legislature|awaiting_signature",
              "last_action_date": "YYYY-MM-DD",
              "last_action_description": "One plain-English sentence describing the action",
              "last_verified": "$TODAY"
            }
          }
          For terminal outcomes: set "status": "failed"|"vetoed"|"in_force" and omit legislative_stage.
          For enacted bills: also set "enacted_date": "YYYY-MM-DD".
          If no verified updates found: write exactly {}
          Do NOT include records you could not verify from an official source.
          USFALLBACK_DONE
          ) > /tmp/log-us-fallback.txt 2>&1 &
          PIDS+=($!)

          # ── Wait for all agents ───────────────────────────────────────────────
          FAILURES=0
          for pid in "${PIDS[@]}"; do
            wait "$pid" || { echo "Agent $pid failed"; ((FAILURES++)) || true; }
          done
          echo "Regional agents complete: $FAILURES failure(s)"

          # Print logs
          for region in europe apac americas africa-me us-fallback; do
            echo "=== $region ==="
            cat /tmp/log-${region}.txt
          done

      # ── Step 3c: Merge regional updates ──────────────────────────────────────
      - name: Merge regional bill stage updates
        run: npx tsx scripts/apply-bill-updates.ts /tmp/updates-europe.json /tmp/updates-apac.json /tmp/updates-americas.json /tmp/updates-africa-me.json /tmp/updates-us-fallback.json

      # ── Step 4: Enforcement actions ───────────────────────────────────────────
      - name: Research new enforcement actions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          cat << PROMPT | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,Read,Write"
          You are maintaining the GAIA enforcement actions database.
          Today is $TODAY. The file is data/enforcement.json.

          Search the web for AI-related enforcement actions in the past 7 days:
          - FTC actions involving AI, algorithms, or automated decision systems
          - GDPR fines from EU data protection authorities (CNIL, ICO, BfDI, etc.) involving AI
          - US state attorney general actions under biometric or AI laws (Illinois BIPA, etc.)
          - SEC, CFPB, EEOC, or HHS enforcement involving AI tools
          - Significant court judgments (not settlements — judgments only)

          Search queries:
            FTC AI enforcement action 2026
            GDPR fine artificial intelligence 2026
            BIPA settlement 2026
            AI discrimination lawsuit ruling 2026

          For each new action found, append a record to data/enforcement.json:
          {
            "id": "{law_slug}-{respondent_slug}-{YYYY}",
            "law_id": "matching law ID from data/regulations.json, or null if unknown",
            "law_short_name": "short name of the law invoked",
            "date": "YYYY-MM-DD",
            "enforcement_body": "agency or court name",
            "respondent": "company or individual name",
            "violation_type": "one-line description of what was violated",
            "amount_usd": null or integer dollar amount,
            "outcome": "brief outcome (e.g. Consent decree, Civil penalty of $X, Injunction)",
            "summary": "2-3 sentence plain English summary of the case.",
            "source_url": "official press release, court filing, or regulator announcement URL"
          }

          Rules:
          - Read data/enforcement.json first — do not add duplicates
          - Only add actions with an official source URL (regulator website, PACER, court site)
          - Be conservative: one verified action beats five uncertain ones
          - If nothing new found, do not modify data/enforcement.json
          PROMPT

      # ── Step 5: Extract rules for newly added laws ────────────────────────────
      - name: Identify newly added laws
        run: |
          jq --slurpfile orig /tmp/original-ids.json '
            ($orig[0] | map({(.): 1}) | add // {}) as $known |
            [ .[] | select(
                ($known[.id] | not) and
                .instrument_binding == true and
                (.status == "in_force" or .status == "enacted_not_yet_effective")
              )
            ]
          ' data/regulations.json > /tmp/new-laws.json
          echo "New binding laws: $(jq -r '[.[].id] | join(", ")' /tmp/new-laws.json)"

      - name: Extract rules for new laws
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          NEW_COUNT=$(jq length /tmp/new-laws.json)
          if [ "$NEW_COUNT" = "0" ]; then
            echo "No new laws to extract rules for — skipping"
            exit 0
          fi
          TODAY=$(date +%Y-%m-%d)
          cat << PROMPT | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Read,Write"
          You are extracting legal rules for newly added laws in the GAIA database.
          Today is $TODAY.

          The file /tmp/new-laws.json lists the new laws added this run.
          The existing rules database is at data/rules.json (array of rule objects).

          For each law in /tmp/new-laws.json:
          1. Read its source_url or official_text_url using WebFetch to get the law text.
             If the URL is unavailable, use the law's summary and key_obligations fields.
          2. Extract the distinct substantive legal rules — specific obligations, prohibitions,
             and rights. Skip pure definitions, recitals, and administrative boilerplate.
          3. For each extracted rule, search data/rules.json for an existing rule it matches:
             - identical: same rule, same wording
             - agrees: same obligation, different wording or scope
             - similar: related but meaningfully different
             - opposed: explicitly contradicts an existing rule
          4. If it matches an existing rule, add a new instance to that rule's instances array.
             If it is genuinely new, add a new rule entry.

          Rule object format (for NEW rules only):
          {
            "rule_id": "r-XXXX",  ← use the next available 4-digit number after existing rules
            "rule_text": "Plain English statement of what the rule requires or prohibits",
            "rule_text_technical": "Precise legal/technical formulation with citations",
            "category": "one of: definitions_scope | transparency | data_governance | risk_management | prohibited_uses | human_oversight | enforcement | institutional_framework | sector_specific | synthetic_media | biometric | employment | liability",
            "tags": ["relevant", "keywords"],
            "first_instance": {
              "law_id": "...",
              "law_name": "...",
              "citation": "Section X",
              "date": "YYYY-MM-DD"
            },
            "instances": [{ ...instance object... }]
          }

          Instance object format (added to EXISTING rules OR included in first_instance of NEW rules):
          {
            "law_id": "...",
            "relationship": "origin|identical|agrees|similar|opposed",
            "citation": "Section or Article reference",
            "notes": "One sentence on scope, differences, or context",
            "instrument_binding": true
          }

          Write the complete updated data/rules.json when done (same array format).
          Prefer adding instances to existing rules over creating new ones.
          Quality over quantity — 3 well-matched rules beat 15 uncertain ones.
          PROMPT
        continue-on-error: true   # don't block the PR if extraction fails

      # ── Step 6: Validate & open PR ────────────────────────────────────────────
      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/regulations.json data/enforcement.json data/rules.json \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Validate if changed
        if: steps.changes.outputs.changed == 'true'
        run: npm run validate

      - name: Generate changelog entry
        if: steps.changes.outputs.changed == 'true'
        run: |
          TODAY=$(date +%Y-%m-%d)
          TRIGGER="${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}"

          # Snapshot the pre-change state from git HEAD
          git show HEAD:data/regulations.json > /tmp/reg-before.json 2>/dev/null || echo '[]' > /tmp/reg-before.json
          git show HEAD:data/enforcement.json > /tmp/enf-before.json 2>/dev/null || echo '[]' > /tmp/enf-before.json
          git show HEAD:data/rules.json > /tmp/rules-before.json 2>/dev/null || echo '[]' > /tmp/rules-before.json

          # New instruments (IDs that didn't exist before)
          jq -s '
            (.[0] | map({(.id): 1}) | add // {}) as $before |
            [.[1][] | select($before[.id] | not) | {
              id,
              name: (.short_name // .name // ""),
              jurisdiction: (.country // ""),
              status
            }]
          ' /tmp/reg-before.json data/regulations.json > /tmp/cl-added.json

          # Promoted (status changed to in_force or enacted_not_yet_effective)
          jq -s '
            (.[0] | map({(.id): .status}) | add // {}) as $before |
            [.[1][] | select(
              $before[.id] != null and
              $before[.id] != .status and
              (.status == "in_force" or .status == "enacted_not_yet_effective")
            ) | {
              id,
              name: (.short_name // .name // ""),
              from: $before[.id],
              to: .status
            }]
          ' /tmp/reg-before.json data/regulations.json > /tmp/cl-promoted.json

          # Count bill stage updates
          STAGE_UPDATES=$(jq -s '
            (.[0] | map({(.id): (.legislative_stage // "")}) | add // {}) as $before |
            [.[1][] | select(
              $before[.id] != null and
              ($before[.id] != (.legislative_stage // "")) and
              (.legislative_stage != null and .legislative_stage != "unknown")
            )] | length
          ' /tmp/reg-before.json data/regulations.json)

          # New enforcement actions
          ENFORCEMENT_ADDED=$(jq -s '
            (.[0] | map({(.id): 1}) | add // {}) as $before |
            [.[1][] | select($before[.id] | not)] | length
          ' /tmp/enf-before.json data/enforcement.json)

          # New rules
          RULES_ADDED=$(jq -s '
            (.[0] | map({(.rule_id): 1}) | add // {}) as $before |
            [.[1][] | select($before[.rule_id] | not)] | length
          ' /tmp/rules-before.json data/rules.json)

          TOTAL=$(jq length data/regulations.json)

          # Build the entry
          jq -n \
            --arg date "$TODAY" \
            --arg trigger "$TRIGGER" \
            --argjson added "$(cat /tmp/cl-added.json)" \
            --argjson promoted "$(cat /tmp/cl-promoted.json)" \
            --argjson stage_updates "$STAGE_UPDATES" \
            --argjson enforcement_added "$ENFORCEMENT_ADDED" \
            --argjson rules_added "$RULES_ADDED" \
            --argjson total "$TOTAL" \
            '{date: $date, trigger: $trigger, added: $added, promoted: $promoted,
              stage_updates: $stage_updates, enforcement_added: $enforcement_added,
              rules_added: $rules_added, total_instruments: $total}' \
            > /tmp/cl-entry.json

          # Prepend to changelog, keep at most 52 entries (1 year of weekly runs)
          if [ -f data/changelog.json ]; then
            jq --slurpfile entry /tmp/cl-entry.json '[$entry[0]] + . | .[0:52]' \
              data/changelog.json > /tmp/cl-new.json
          else
            jq -s '.' /tmp/cl-entry.json > /tmp/cl-new.json
          fi
          mv /tmp/cl-new.json data/changelog.json

          echo "Changelog entry written: $(jq '{added: (.added|length), promoted: (.promoted|length), stage_updates, enforcement_added, rules_added}' /tmp/cl-entry.json)"
        continue-on-error: true   # don't block the PR if changelog generation fails

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: weekly-update/${{ github.run_id }}
          commit-message: "data: weekly regulation update — ${{ github.run_id }}"
          title: "Weekly regulation update — ${{ github.event.schedule && 'scheduled' || 'manual' }}"
          body: |
            Automated weekly update from the GAIA curator agent.

            Changes across `data/regulations.json`, `data/enforcement.json`, and `data/rules.json`.

            Please review:
            - New laws: source URLs are official government/regulatory body publications
            - Effective date promotions: check `in_force` status changes are correct
            - Bill stage updates: stages match official legislature records
            - Enforcement actions: source URLs are official regulator/court publications
            - Rule extractions: instances reference correct laws and relationships

            Merge when satisfied. The deploy workflow will publish to GitHub Pages automatically.
          labels: automated, data-update
