name: Fix Unknown Bill Stages

# Deploys one Claude agent per state to look up unknown-stage bills
# on LegiScan.com public pages and official state legislature sites.
# No API key required — uses public web search and fetch.
#
# Runs daily until the unknown-stage backlog is cleared, then becomes a no-op.

on:
  schedule:
    - cron: '0 12 * * *'   # Daily at noon UTC
  workflow_dispatch:
    inputs:
      states:
        description: 'Comma-separated state codes to process (e.g. IL,CA,NY). Blank = auto top-6.'
        required: false
        default: ''
      per_state_limit:
        description: 'Max bills per state per run (default 40)'
        required: false
        default: '40'


jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # ── Identify states and write per-state bill files ─────────────────────
      - name: Identify unknown-stage bills by state
        id: check
        run: |
          LIMIT="${{ github.event.inputs.per_state_limit || '40' }}"
          INPUT_STATES="${{ github.event.inputs.states }}"

          # All proposed US state bills with unknown/missing stage
          jq '[.[] | select(
            .status == "proposed" and
            ((.region // "") | test("^US-[A-Z]{2}$")) and
            (.legislative_stage == null or .legislative_stage == "unknown") and
            .bill_number != null
          )]' data/regulations.json > /tmp/all-unknown.json

          echo "Total unknown-stage US state bills: $(jq length /tmp/all-unknown.json)"

          # Determine which states to process
          if [ -n "$INPUT_STATES" ]; then
            echo "$INPUT_STATES" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | \
              jq -R . | jq -sc . > /tmp/states-to-process.json
          else
            # Top 6 by unknown count
            jq -r '
              group_by(.region) |
              map({state: .[0].region[3:], count: length}) |
              sort_by(-.count) | reverse |
              .[0:6] |
              .[].state
            ' /tmp/all-unknown.json | jq -R . | jq -sc . > /tmp/states-to-process.json
          fi

          echo "States: $(jq -r '.[]' /tmp/states-to-process.json | tr '\n' ' ')"

          # Write per-state bill files
          while IFS= read -r STATE; do
            jq --arg region "US-$STATE" --argjson limit "$LIMIT" '
              [.[] | select(.region == $region)] |
              .[0:$limit] |
              map({id: .id, bill_number: .bill_number, name: (.short_name // .name // "")})
            ' /tmp/all-unknown.json > /tmp/unknown-$STATE.json
            echo "$STATE: $(jq length /tmp/unknown-$STATE.json) bills queued"
          done < <(jq -r '.[]' /tmp/states-to-process.json)

          STATE_COUNT=$(jq length /tmp/states-to-process.json)
          echo "state_count=$STATE_COUNT" >> $GITHUB_OUTPUT

      # ── Illinois ───────────────────────────────────────────────────────────
      - name: Research Illinois bills
        if: steps.check.outputs.state_count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -f /tmp/unknown-IL.json ] && [ -s /tmp/unknown-IL.json ] || { echo "No IL bills"; exit 0; }
          TODAY=$(date +%Y-%m-%d)
          cat << PROMPT | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Write"
          Research the current legislative stage for Illinois AI bills. Today is $TODAY.

          Bills to look up: /tmp/unknown-IL.json
          Write results to: /tmp/results-IL.json

          For each bill:
          1. WebFetch https://legiscan.com/IL/bill/{BILL_NO}/{YEAR}
             Normalize: "H 1234" → "HB1234", "S 300" → "SB300". Try 2026 first, then 2025.
          2. Fallback: WebSearch "{bill_number} Illinois legislature 2026 site:legiscan.com"
          3. Fallback: https://www.ilga.gov

          Stage values (use exactly one):
            introduced | in_committee | passed_committee | passed_one_chamber | passed_legislature | awaiting_signature | unknown

          If the bill has resolved, use the status field instead of legislative_stage:
            in_force (signed into law) | vetoed | failed (died, tabled, session ended, sine die)

          Output — write a JSON array to /tmp/results-IL.json:
          [{ "id": "...", "legislative_stage": "in_committee", "last_action_date": "YYYY-MM-DD", "last_action_description": "...", "last_verified": "$TODAY" }]
          OR for resolved bills:
          [{ "id": "...", "status": "failed", "last_action_date": "YYYY-MM-DD", "last_action_description": "...", "last_verified": "$TODAY" }]

          Rules: only include bills you found reliable info for. Do not guess or invent.
          "Session Sine Die" or "Failed" on LegiScan → status: "failed".
          PROMPT

      # ── California ─────────────────────────────────────────────────────────
      - name: Research California bills
        if: steps.check.outputs.state_count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -f /tmp/unknown-CA.json ] && [ -s /tmp/unknown-CA.json ] || { echo "No CA bills"; exit 0; }
          TODAY=$(date +%Y-%m-%d)
          cat << PROMPT | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Write"
          Research the current legislative stage for California AI bills. Today is $TODAY.

          Bills to look up: /tmp/unknown-CA.json
          Write results to: /tmp/results-CA.json

          For each bill:
          1. WebFetch https://legiscan.com/CA/bill/{BILL_NO}/{YEAR}
             Normalize: "S 300" → "SB300", "A 412" → "AB412". Try 2026 first, then 2025.
          2. Fallback: https://leginfo.legislature.ca.gov (CA official)
          3. Fallback: WebSearch "{bill_number} California legislature 2026 status"

          CA has a 2-year session (2025-2026). Bills from 2025 can carry over to 2026.
          Bills not passed by end of 2026 session → failed.

          Same output format and stage/status values as above.
          Write JSON array to /tmp/results-CA.json.
          PROMPT

      # ── New York ───────────────────────────────────────────────────────────
      - name: Research New York bills
        if: steps.check.outputs.state_count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -f /tmp/unknown-NY.json ] && [ -s /tmp/unknown-NY.json ] || { echo "No NY bills"; exit 0; }
          TODAY=$(date +%Y-%m-%d)
          cat << PROMPT | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Write"
          Research the current legislative stage for New York AI bills. Today is $TODAY.

          Bills to look up: /tmp/unknown-NY.json
          Write results to: /tmp/results-NY.json

          For each bill:
          1. WebFetch https://legiscan.com/NY/bill/{BILL_NO}/{YEAR}
             Normalize: "S 1234" → "S1234", "A 6453" → "A6453". Try 2026 first, then 2025.
          2. Fallback: https://legislation.nysenate.gov/api/3/bills/2025/{PRINT_NO}?key=PUBLIC
          3. Fallback: WebSearch "{bill_number} New York legislature 2026 status"

          NY has a 2-year session (2025-2026). "Referred to Rules" often means shelved.

          Same output format and stage/status values as above.
          Write JSON array to /tmp/results-NY.json.
          PROMPT

      # ── Hawaii ─────────────────────────────────────────────────────────────
      - name: Research Hawaii bills
        if: steps.check.outputs.state_count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -f /tmp/unknown-HI.json ] && [ -s /tmp/unknown-HI.json ] || { echo "No HI bills"; exit 0; }
          TODAY=$(date +%Y-%m-%d)
          cat << PROMPT | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Write"
          Research the current legislative stage for Hawaii AI bills. Today is $TODAY.

          Bills to look up: /tmp/unknown-HI.json
          Write results to: /tmp/results-HI.json

          For each bill:
          1. WebFetch https://legiscan.com/HI/bill/{BILL_NO}/{YEAR}
             Normalize: "H 1782" → "HB1782", "S 100" → "SB100". Try 2026 first, then 2025.
          2. Fallback: https://capitol.hawaii.gov
          3. Fallback: WebSearch "{bill_number} Hawaii legislature 2026 status"

          Hawaii's session typically ends in May. Bills not passed by adjournment → failed.

          Same output format and stage/status values as above.
          Write JSON array to /tmp/results-HI.json.
          PROMPT

      # ── Oklahoma ───────────────────────────────────────────────────────────
      - name: Research Oklahoma bills
        if: steps.check.outputs.state_count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -f /tmp/unknown-OK.json ] && [ -s /tmp/unknown-OK.json ] || { echo "No OK bills"; exit 0; }
          TODAY=$(date +%Y-%m-%d)
          cat << PROMPT | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Write"
          Research the current legislative stage for Oklahoma AI bills. Today is $TODAY.

          Bills to look up: /tmp/unknown-OK.json
          Write results to: /tmp/results-OK.json

          For each bill:
          1. WebFetch https://legiscan.com/OK/bill/{BILL_NO}/{YEAR}
             Normalize: "H 1234" → "HB1234", "S 500" → "SB500". Try 2026 first, then 2025.
          2. Fallback: https://www.oklegislature.gov
          3. Fallback: WebSearch "{bill_number} Oklahoma legislature 2026 status"

          Same output format and stage/status values as above.
          Write JSON array to /tmp/results-OK.json.
          PROMPT

      # ── Puerto Rico ────────────────────────────────────────────────────────
      - name: Research Puerto Rico bills
        if: steps.check.outputs.state_count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -f /tmp/unknown-PR.json ] && [ -s /tmp/unknown-PR.json ] || { echo "No PR bills"; exit 0; }
          TODAY=$(date +%Y-%m-%d)
          cat << PROMPT | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Write"
          Research the current legislative stage for Puerto Rico AI bills. Today is $TODAY.

          Bills to look up: /tmp/unknown-PR.json
          Write results to: /tmp/results-PR.json

          For each bill:
          1. WebSearch "{bill_number} Puerto Rico Asamblea Legislativa 2025 2026"
          2. WebFetch https://www.oslpr.org (Puerto Rico legislature — bills may be in Spanish)
          Note: LegiScan does not cover Puerto Rico — use official sources only.

          Spanish terms: Aprobado=passed, Archivado=tabled/failed, Firmado=signed (in_force), Vetado=vetoed.

          Same output format and stage/status values as above.
          Write JSON array to /tmp/results-PR.json.
          PROMPT

      # ── Remaining states (batch) ────────────────────────────────────────────
      - name: Research remaining states
        if: steps.check.outputs.state_count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Find states not handled by dedicated steps above
          jq '[.[] | select(. != "IL" and . != "CA" and . != "NY" and . != "HI" and . != "OK" and . != "PR")]' \
            /tmp/states-to-process.json > /tmp/remaining-states.json

          REMAINING=$(jq length /tmp/remaining-states.json)
          if [ "$REMAINING" = "0" ]; then
            echo "No remaining states to process"
            echo '[]' > /tmp/results-REMAINING.json
            exit 0
          fi

          # Build combined {STATE: [bills...]} object for the Claude agent
          echo '{}' > /tmp/unknown-REMAINING.json
          while IFS= read -r STATE; do
            if [ -f /tmp/unknown-$STATE.json ] && [ -s /tmp/unknown-$STATE.json ]; then
              jq --arg s "$STATE" --slurpfile b /tmp/unknown-$STATE.json \
                '. + {($s): $b[0]}' /tmp/unknown-REMAINING.json > /tmp/unknown-REMAINING.new.json
              mv /tmp/unknown-REMAINING.new.json /tmp/unknown-REMAINING.json
            fi
          done < <(jq -r '.[]' /tmp/remaining-states.json)

          TOTAL=$(jq '[.[] | length] | add // 0' /tmp/unknown-REMAINING.json)
          echo "Remaining: $(jq -r 'keys | join(", ")' /tmp/unknown-REMAINING.json) — $TOTAL bills"

          TODAY=$(date +%Y-%m-%d)
          cat << PROMPT | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Write"
          Research the current legislative stage for US state AI bills. Today is $TODAY.

          /tmp/unknown-REMAINING.json contains bills grouped by state code: { "AK": [...], "AZ": [...], ... }
          Write all results to /tmp/results-REMAINING.json as a flat JSON array.

          For each bill in each state:
          1. WebFetch https://legiscan.com/{STATE}/bill/{BILL_NO}/{YEAR}
             Normalize: "H 47" → "HB47", "S 283" → "SB283". Try 2026 first, then 2025.
          2. Fallback: WebSearch "{bill_number} {state full name} legislature 2026 status"

          Stage values: introduced | in_committee | passed_committee | passed_one_chamber | passed_legislature | awaiting_signature | unknown
          Terminal (use status field): in_force | vetoed | failed

          Output format:
          [{ "id": "...", "legislative_stage": "..." OR "status": "...", "last_action_date": "YYYY-MM-DD", "last_action_description": "...", "last_verified": "$TODAY" }]

          Only include bills you found reliable info for. Do not guess.
          Write flat JSON array to /tmp/results-REMAINING.json.
          PROMPT

      # ── Merge all results back into regulations.json ────────────────────────
      - name: Merge research results
        run: |
          # Ensure all result files are valid JSON arrays (write empty array if missing/invalid)
          for STATE in IL CA NY HI OK PR REMAINING; do
            if [ -f /tmp/results-$STATE.json ]; then
              jq empty /tmp/results-$STATE.json 2>/dev/null || echo '[]' > /tmp/results-$STATE.json
            else
              echo '[]' > /tmp/results-$STATE.json
            fi
          done

          # Merge into id-keyed map (last write wins on duplicates)
          jq -s '
            flatten |
            map(select(.id != null)) |
            map({(.id): .}) |
            add // {}
          ' /tmp/results-IL.json /tmp/results-CA.json /tmp/results-NY.json \
            /tmp/results-HI.json /tmp/results-OK.json /tmp/results-PR.json \
            /tmp/results-REMAINING.json > /tmp/all-updates.json

          UPDATED=$(jq length /tmp/all-updates.json)
          echo "Applying $UPDATED updates"

          if [ "$UPDATED" = "0" ]; then
            echo "Agents found no reliable data this run"
            exit 0
          fi

          TODAY=$(date +%Y-%m-%d)
          jq --slurpfile updates /tmp/all-updates.json --arg today "$TODAY" '
            map(
              . as $r |
              ($updates[0][$r.id] // null) as $u |
              if $u != null then
                . + $u |
                if (.status == "in_force" or .status == "vetoed" or .status == "failed"
                    or .status == "rescinded" or .status == "withdrawn") then
                  del(.legislative_stage) |
                  if .status == "in_force" and .enacted_date == null then
                    .enacted_date = ($u.last_action_date // $today)
                  else . end
                else . end
              else . end
            )
          ' data/regulations.json > /tmp/regulations-updated.json

          mv /tmp/regulations-updated.json data/regulations.json

          echo "Breakdown:"
          jq -r '
            to_entries |
            map(.value | (.status // .legislative_stage // "refreshed")) |
            group_by(.) | map("\(.[0]): \(length)") | .[]
          ' /tmp/all-updates.json

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/regulations.json \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Validate if changed
        if: steps.changes.outputs.changed == 'true'
        run: npm run validate

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: fix-stages/${{ github.run_id }}
          commit-message: "data: fix unknown bill stages via agent research — ${{ github.run_id }}"
          title: "Unknown bill stage fix — ${{ github.run_id }}"
          body: |
            Agent-researched legislative stages for unknown-stage US state bills.

            Each state was handled by a dedicated Claude agent searching LegiScan.com
            public pages and official state legislature websites.

            Changes may include:
            - `legislative_stage` populated (was `unknown`)
            - Bills resolved to `failed` (session ended, died in committee)
            - Bills promoted to `in_force` (signed into law)
            - `last_action_date` and `last_action_description` populated

            Please spot-check a few records against official sources before merging.
          labels: automated, data-update, bill-stages
