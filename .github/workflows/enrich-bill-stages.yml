name: Enrich Bill Stages

on:
  workflow_dispatch:


jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Extract proposed bills to working file
        run: |
          jq '[.[] | select(.status == "proposed")]' data/regulations.json > data/proposed-bills.json
          echo "Extracted $(jq length data/proposed-bills.json) proposed bills"
          echo "Breakdown by region:"
          jq -r 'group_by(.region) | .[] | "\(.[0].region): \(length)"' data/proposed-bills.json | sort

      # ── US State Bills ────────────────────────────────────────────────────────
      - name: Enrich US state bill stages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          jq '[.[] | select(.region | startswith("US-"))]' data/proposed-bills.json \
            > /tmp/us-bills.json
          echo "US state bills: $(jq length /tmp/us-bills.json)"
          cat << PROMPT | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Read,Write"
          You are enriching legislative stage data for US state AI bills in GAIA.
          Today is $TODAY.

          /tmp/us-bills.json contains all proposed US state AI bills.
          Write your updates back to /tmp/us-bills.json.

          Strategy — work state by state:
          For each state present in the file, run ONE search:
            "[State] artificial intelligence bill 2025 2026 passed signed committee"
          Also try: site:legiscan.com [State] artificial intelligence 2026

          For each bill, set:
            legislative_stage — one of:
              introduced          filed, no committee action
              in_committee        referred to and pending in committee
              passed_committee    cleared committee, heading to floor
              passed_one_chamber  passed house or senate
              passed_legislature  passed both chambers
              awaiting_signature  on governor's desk
              unknown             could not determine

            last_action_date    — YYYY-MM-DD or null
            last_action_description — one plain-English sentence

          If a bill has resolved:
          - Signed into law: status = in_force or enacted_not_yet_effective,
            add enacted_date, remove legislative_stage
          - Failed/died/tabled/vetoed: status = failed or vetoed, remove legislative_stage

          Sources: official state legislature sites, LegiScan, Ballotpedia, major news.
          Default to unknown if you cannot find reliable info. Do not invent data.
          Write the complete updated array back to /tmp/us-bills.json.
          PROMPT

      # ── EU Legislative Pipeline ───────────────────────────────────────────────
      - name: Enrich EU and European bill stages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          jq '[.[] | select(
                .jurisdiction_type == "supranational" or
                .country == "European Union" or
                (.region == "Europe & Central Asia" and .status == "proposed")
              )]' data/proposed-bills.json > /tmp/eu-bills.json
          echo "EU/European bills: $(jq length /tmp/eu-bills.json)"
          cat << PROMPT | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Read,Write"
          You are enriching legislative stage data for EU and European AI bills in GAIA.
          Today is $TODAY.

          /tmp/eu-bills.json contains proposed EU/European AI instruments.
          Write your updates back to /tmp/eu-bills.json.

          EU LEGISLATIVE PROCEDURE — stage mapping:
            introduced        = Commission proposal published (COM/YYYY/NNN)
            in_committee      = EP committee(s) drafting opinion / Council working group active
            passed_committee  = EP committee report adopted
            passed_one_chamber = EP plenary vote passed (first reading position)
            passed_legislature = Trilogue concluded / Council adopted EP position
            awaiting_signature = Signed, pending Official Journal publication date

          For each EU instrument, check EUR-Lex (eur-lex.europa.eu/procedure) using
          the document reference or title. Search: "EUR-Lex [short_name] legislative procedure"

          UK BILLS — stage mapping:
            introduced        = First Reading
            in_committee      = Second Reading / Committee Stage
            passed_committee  = Report Stage complete
            passed_one_chamber = Third Reading (Commons or Lords)
            passed_legislature = Passed both Houses
            awaiting_signature = Awaiting Royal Assent

          For UK bills, check bills.parliament.uk using bill_number or short_name.
          Search: "site:bills.parliament.uk [bill_number or short_name]"

          OTHER EUROPEAN COUNTRIES (Germany, France, Netherlands, etc.):
          Search "[country] [bill_name] parliament status 2026" and check official
          parliament websites where accessible.

          For any bill that has been enacted or failed, update status accordingly.
          Set last_action_date, last_action_description, last_verified=$TODAY.
          Default to unknown if you cannot find reliable info.
          Write the complete updated array back to /tmp/eu-bills.json.
          PROMPT

      # ── Asia-Pacific Bills ────────────────────────────────────────────────────
      - name: Enrich Asia-Pacific bill stages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          jq '[.[] | select(.region == "East Asia & Pacific" or .region == "South Asia")]' \
            data/proposed-bills.json > /tmp/apac-bills.json
          echo "APAC bills: $(jq length /tmp/apac-bills.json)"
          cat << PROMPT | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Read,Write"
          You are enriching legislative stage data for Asia-Pacific AI bills in GAIA.
          Today is $TODAY.

          /tmp/apac-bills.json contains proposed APAC AI bills.
          Write your updates back to /tmp/apac-bills.json.

          JAPAN — stage mapping:
            introduced        = Submitted to the Diet (cabinet or member bill)
            in_committee      = Referred to and under deliberation in committee
            passed_committee  = Committee approved (委員会可決)
            passed_one_chamber = Passed House of Representatives OR House of Councillors
            passed_legislature = Passed both chambers (両院通過)
            awaiting_signature = Promulgation pending (布告待ち)
          Search: "人工知能 法案 [bill details] 国会" or kokkai.ndl.go.jp

          SOUTH KOREA — stage mapping mirrors Japan (National Assembly is unicameral):
            introduced        = Introduced (발의)
            in_committee      = In standing committee (소관위원회 심사)
            passed_committee  = Committee approved (위원회 통과)
            passed_legislature = Plenary vote passed (본회의 의결)
            awaiting_signature = Presidential promulgation pending
          Search: "인공지능 법안 [bill_number] 국회" or assembly.go.kr

          AUSTRALIA — bicameral (House + Senate):
            introduced        = First Reading
            in_committee      = Second Reading / Committee inquiry
            passed_committee  = Committee report tabled
            passed_one_chamber = Passed House or Senate
            passed_legislature = Passed both chambers
            awaiting_signature = Royal Assent pending
          Search: site:aph.gov.au [bill_number or short_name]

          INDIA — bicameral (Lok Sabha + Rajya Sabha):
          Search: site:loksabha.nic.in OR site:rajyasabha.nic.in [bill_name]

          SINGAPORE: search site:parliament.gov.sg [bill_name]

          OTHER APAC: Search "[country] AI bill [bill_number] parliament 2026"

          Set last_action_date, last_action_description, last_verified=$TODAY.
          Default to unknown if reliable info not found. Do not invent data.
          Write the complete updated array back to /tmp/apac-bills.json.
          PROMPT

      # ── Americas (non-US) Bills ───────────────────────────────────────────────
      - name: Enrich Americas bill stages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          jq '[.[] | select(
                (.region == "Latin America & Caribbean" or .region == "North America") and
                (.region | startswith("US-") | not) and
                .country != "United States"
              )]' data/proposed-bills.json > /tmp/americas-bills.json
          echo "Americas (non-US) bills: $(jq length /tmp/americas-bills.json)"
          cat << PROMPT | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Read,Write"
          You are enriching legislative stage data for non-US Americas AI bills in GAIA.
          Today is $TODAY.

          /tmp/americas-bills.json contains proposed bills from Canada, Brazil, Mexico, etc.
          Write your updates back to /tmp/americas-bills.json.

          CANADA — bicameral (House of Commons + Senate):
            introduced        = First Reading
            in_committee      = Second Reading / Committee study
            passed_committee  = Committee report
            passed_one_chamber = Third Reading (Commons or Senate)
            passed_legislature = Passed both chambers
            awaiting_signature = Royal Assent pending
          Search: site:parl.ca/legisinfo [bill_number] OR
            "LEGISinfo [bill_number] artificial intelligence"

          BRAZIL — bicameral (Câmara + Senado):
            introduced        = Presented (apresentado)
            in_committee      = In committee (em comissão)
            passed_committee  = Committee approved (aprovado em comissão)
            passed_one_chamber = Passed Câmara or Senado
            passed_legislature = Passed both chambers
            awaiting_signature = Presidential sanction pending
          Search: site:camara.leg.br [bill_number] OR
            site:senado.leg.br "inteligência artificial" [bill_number]

          MEXICO: search site:congreso.gob.mx [bill details]

          OTHER LATIN AMERICA: Search "[country] inteligencia artificial proyecto de ley [details]"

          Set last_action_date, last_action_description, last_verified=$TODAY.
          Default to unknown if reliable info not found.
          Write the complete updated array back to /tmp/americas-bills.json.
          PROMPT

      # ── Africa & Middle East Bills ────────────────────────────────────────────
      - name: Enrich Africa and Middle East bill stages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          jq '[.[] | select(
                .region == "Sub-Saharan Africa" or
                .region == "Middle East & North Africa"
              )]' data/proposed-bills.json > /tmp/afme-bills.json
          echo "Africa/Middle East bills: $(jq length /tmp/afme-bills.json)"
          if [ "$(jq length /tmp/afme-bills.json)" = "0" ]; then
            echo "No Africa/Middle East bills to enrich"
            exit 0
          fi
          cat << PROMPT | claude --print --dangerously-skip-permissions --allowedTools "WebSearch,WebFetch,Read,Write"
          You are enriching legislative stage data for Africa and Middle East AI bills in GAIA.
          Today is $TODAY.

          /tmp/afme-bills.json contains proposed bills from these regions.
          Write your updates back to /tmp/afme-bills.json.

          For each bill, search:
            "[country] AI artificial intelligence bill [bill_number or short_name] parliament 2026"
          Also check official parliament websites where accessible:
          - South Africa: parliament.gov.za
          - Kenya: parliament.go.ke
          - Nigeria: nass.gov.ng
          - UAE: uaecabinet.ae or moccae.gov.ae
          - Saudi Arabia: shura.gov.sa

          Map to the standard stage taxonomy using country-appropriate terms.
          Set last_action_date, last_action_description, last_verified=$TODAY.
          Default to unknown if reliable info not found.
          Write the complete updated array back to /tmp/afme-bills.json.
          PROMPT

      # ── Merge all enriched subsets back ──────────────────────────────────────
      - name: Merge enriched bills back into regulations.json
        run: |
          # Combine all enriched subsets into one map, preferring last-written value
          jq -s '
            (.[0] + .[1] + .[2] + .[3] + .[4]) |
            map({(.id): .}) | add // {}
          ' /tmp/us-bills.json /tmp/eu-bills.json /tmp/apac-bills.json \
            /tmp/americas-bills.json /tmp/afme-bills.json \
            > /tmp/enriched-map.json

          jq --slurpfile enriched /tmp/enriched-map.json '
            map(if $enriched[0][.id] then $enriched[0][.id] else . end)
          ' data/regulations.json > /tmp/regulations-updated.json

          mv /tmp/regulations-updated.json data/regulations.json
          echo "Merge complete — $(jq length data/regulations.json) total records"
          rm -f data/proposed-bills.json /tmp/us-bills.json /tmp/eu-bills.json \
                /tmp/apac-bills.json /tmp/americas-bills.json /tmp/afme-bills.json \
                /tmp/enriched-map.json

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/regulations.json \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Validate if changed
        if: steps.changes.outputs.changed == 'true'
        run: npm run validate

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: enrich-stages/${{ github.run_id }}
          commit-message: "data: enrich legislative stages — global — ${{ github.run_id }}"
          title: "Bill stage enrichment (global) — ${{ github.run_id }}"
          body: |
            Full global enrichment of `legislative_stage`, `last_action_date`, and
            `last_action_description` for all proposed bills in `data/regulations.json`.

            Covers: US states · EU · UK · Europe · Japan · South Korea · Australia ·
            India · Canada · Brazil · Mexico · Africa · Middle East

            Please review before merging:
            - Stages match official legislative records
            - Status changes (enacted/failed) are accurate
            - Sources are reliable (official parliament sites, LegiScan, Ballotpedia)
          labels: automated, data-update, bill-stages
