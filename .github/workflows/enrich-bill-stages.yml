name: Enrich Bill Stages

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Extract proposed bills to working file
        run: |
          jq '[.[] | select(.status == "proposed")]' data/regulations.json > data/proposed-bills.json
          echo "Extracted $(jq length data/proposed-bills.json) proposed bills"

      - name: Enrich bill stages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --print --dangerously-skip-permissions --allowedTools "WebSearch,Read,Write" "
          You are enriching legislative stage data for the GAIA AI regulation database.
          Today is $(date +%Y-%m-%d).

          The file data/proposed-bills.json contains all proposed AI bills (already extracted
          for you — do NOT touch data/regulations.json directly).

          Your task: for each bill, research its current legislative stage and update
          the record with three new fields:

            legislative_stage — one of:
              'introduced'          filed but no committee action yet
              'in_committee'        referred to and pending in committee
              'passed_committee'    cleared committee, heading to floor
              'passed_one_chamber'  passed house or senate
              'passed_legislature'  passed both chambers
              'awaiting_signature'  on governor's desk
              'unknown'             could not determine (use this as default)

            last_action_date — 'YYYY-MM-DD' or null

            last_action_description — one plain-English sentence, e.g.
              'Passed Senate 32–6, referred to House Commerce Committee'

          ALSO update status if the bill has resolved:
            - Signed into law → status: 'in_force' or 'enacted_not_yet_effective',
              add enacted_date, remove legislative_stage
            - Failed/died/tabled → status: 'failed', remove legislative_stage

          Strategy — work state by state:
            For each state, run ONE search like:
              '[State name] AI artificial intelligence bill 2025 2026 passed signed committee'
            Then match results to specific bill_numbers in the file.
            Also try: 'site:legiscan.com [State] artificial intelligence 2026'

          Rules:
            - Default legislative_stage to 'unknown' if you cannot find reliable info.
            - Only use official legislature sites, LegiScan, Ballotpedia, or major news.
            - Do not invent data.
            - After processing all states, write the complete updated array back to
              data/proposed-bills.json (same format, array of objects).
          "

      - name: Merge enriched bills back into regulations.json
        run: |
          jq --slurpfile enriched data/proposed-bills.json \
            '($enriched[0] | map({(.id): .}) | add) as $map |
             map(if $map[.id] then $map[.id] else . end)' \
            data/regulations.json > /tmp/regulations-updated.json
          mv /tmp/regulations-updated.json data/regulations.json
          echo "Merged $(jq length data/proposed-bills.json) enriched bills back"
          rm data/proposed-bills.json

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/regulations.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Validate if changed
        if: steps.changes.outputs.changed == 'true'
        run: npm run validate

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: enrich-stages/${{ github.run_id }}
          commit-message: "data: enrich legislative stages for proposed bills — ${{ github.run_id }}"
          title: "Bill stage enrichment — ${{ github.run_id }}"
          body: |
            Enrichment of `legislative_stage`, `last_action_date`, and
            `last_action_description` for proposed bills in `data/regulations.json`.

            Please review before merging:
            - Stages match official legislative records
            - Status changes (enacted/failed) are accurate
            - Sources are reliable (legislature websites, LegiScan, Ballotpedia)
          labels: automated, data-update, bill-stages
