<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Globe circle -->
  <circle cx="16" cy="16" r="13" fill="#8b7355"/>
  <!-- Latitude lines -->
  <ellipse cx="16" cy="16" rx="13" ry="5.5" fill="none" stroke="#f9f6f1" stroke-width="1.1" opacity="0.6"/>
  <!-- Vertical meridian -->
  <ellipse cx="16" cy="16" rx="5.5" ry="13" fill="none" stroke="#f9f6f1" stroke-width="1.1" opacity="0.6"/>
  <!-- Equator -->
  <line x1="3" y1="16" x2="29" y2="16" stroke="#f9f6f1" stroke-width="1.1" opacity="0.6"/>
  <!-- Outline -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#7a6447" stroke-width="1"/>
</svg>
